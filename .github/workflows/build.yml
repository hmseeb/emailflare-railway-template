name: Build and push image

on:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Upstream trunk commit this image is built from (0xdps/emailflare, MIT).
  UPSTREAM_SHA: cf31f33bbb4a324d5353b8a5db0312fedc19618f
  TAG: cf31f33-r2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 0xdps/emailflare
          ref: ${{ env.UPSTREAM_SHA }}
      - name: Patch upstream Dockerfile
        # Upstream copies node_modules/.pnpm but not each workspace package's node_modules
        # symlinks, so the server dies with "Cannot find package '@hono/node-server'".
        # The symlinks are relative into /app/node_modules/.pnpm, which is copied.
        run: |
          sed -i '/^COPY --from=build-backend \/app\/services\/email-server\/dist/a\
          COPY --from=build-backend /app/services/email-server/node_modules ./services/email-server/node_modules\
          COPY --from=build-backend /app/services/emails/node_modules ./services/emails/node_modules\
          COPY --from=build-backend /app/packages/email-core/node_modules ./packages/email-core/node_modules' deploy/docker/Dockerfile.email-api
          grep -n 'node_modules' deploy/docker/Dockerfile.email-api
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.email-api
          push: true
          # Railway runs amd64.
          platforms: linux/amd64
          # shortcut: mesahub-core is cloned from its trunk at build time (as upstream CI does); the pushed tag is the pin, rebuild = new rN tag.
          build-args: MESAHUB_CORE_VERSION=trunk
          # Dockerfile mounts gh_token for the mesahub-core clone; that repo is public, any token works.
          secrets: gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/emailflare-railway-api:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
