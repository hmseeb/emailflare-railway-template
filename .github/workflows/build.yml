name: Build and push image

on:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Upstream trunk commit this image is built from (0xdps/emailflare, MIT).
  # trunk HEAD 85cecbe (2026-11-12) has the same tree (4cd0a271); the 8 commits since cf31f33
  # only add and revert a secret-exfil step in upstream's own CI.
  UPSTREAM_SHA: cf31f33bbb4a324d5353b8a5db0312fedc19618f
  # mesahub-db/mesahub-core trunk content (tree bb48cd6f, same at trunk HEAD 446e501), fetched by exact commit.
  MESAHUB_CORE_SHA: 28aae9cf4ff254c875983ff37bbbf7ae333470a9
  TAG: cf31f33-r3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 0xdps/emailflare
          ref: ${{ env.UPSTREAM_SHA }}
      - uses: actions/checkout@v4
        with:
          path: tpl
      - name: Patch upstream Dockerfile
        # node_modules symlink copies + mesahub-core fetched by exact commit (scripts/patch_dockerfile.py).
        run: |
          python3 -I tpl/scripts/patch_dockerfile.py deploy/docker/Dockerfile.email-api
          rm -rf tpl
          grep -n 'node_modules\|mesahub-core' deploy/docker/Dockerfile.email-api
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.email-api
          push: true
          # Railway runs amd64.
          platforms: linux/amd64
          build-args: MESAHUB_CORE_VERSION=${{ env.MESAHUB_CORE_SHA }}
          # Dockerfile mounts gh_token for the mesahub-core clone; that repo is public, any token works.
          secrets: gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/emailflare-railway-api:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
